<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#243f32">
  <title>부조금 명부 조회</title>
  <script src="./data.js"></script>
  <style>
    :root{--ink:#1e2521;--muted:#7b837e;--line:#e4e7e4;--paper:#f6f7f5;--card:#fff;--green:#315c46;--green2:#243f32;--soft:#e8f0ea}
    *{box-sizing:border-box}html{background:var(--paper)}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
    button,input{font:inherit}button{-webkit-tap-highlight-color:transparent;cursor:pointer}.app{width:min(100%,620px);min-height:100dvh;margin:auto;padding:18px 16px 36px}
    .top{display:flex;align-items:center;justify-content:space-between;padding:2px 0 16px}.top p{margin:0 0 2px;color:var(--muted);font-size:10px}.top h1{margin:0;font-size:23px;letter-spacing:-.04em}
    .add{min-height:40px;padding:0 15px;border:0;border-radius:12px;background:var(--green);color:#fff;font-size:13px;font-weight:800}
    .summary{padding:20px;border-radius:18px;background:var(--green2);color:#fff}.summary span,.summary p{color:#c8d5cd;font-size:12px}.summary strong{display:block;margin-top:6px;font-size:clamp(29px,8vw,38px);font-variant-numeric:tabular-nums;letter-spacing:-.045em}.summary p{margin:9px 0 0}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:12px 0;padding:4px;border:1px solid var(--line);border-radius:14px;background:#ecefec}.tabs button{min-height:42px;border:0;border-radius:10px;background:transparent;color:#737b76;font-size:13px;font-weight:800}.tabs button.active{background:#fff;color:var(--green);box-shadow:0 2px 8px #1f332814}
    .search{display:flex;align-items:center;height:50px;gap:9px;padding:0 13px;border:1px solid var(--line);border-radius:14px;background:#fff}.search:focus-within{border-color:var(--green);box-shadow:0 0 0 3px #315c461a}.search b{color:var(--green);font-size:22px}.search input{width:100%;border:0;outline:0;background:transparent;font-size:15px}.search button{display:none;width:29px;height:29px;border:0;border-radius:50%;background:#edf0ed;color:#69716c;font-size:19px}.notice{display:none;margin-top:10px;padding:11px 13px;border-radius:11px;background:var(--soft);color:var(--green);font-size:12px;font-weight:700}
    .list{margin-top:18px}.list-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 8px}.list-head h2{margin:0;font-size:16px}.list-head span{color:var(--muted);font-size:12px}.sorter{display:none;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:10px;padding:4px;border:1px solid var(--line);border-radius:12px;background:#ecefec}.sorter button{min-height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:12px;font-weight:800}.sorter button.active{background:#fff;color:var(--green)}.results{overflow:hidden;padding:0 14px;border:1px solid var(--line);border-radius:16px;background:#fff}
    .row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:68px;border-bottom:1px solid #eceeec}.row:last-child{border-bottom:0}.mark{display:grid;width:34px;height:34px;place-items:center;border-radius:10px;background:#e9f0f4;color:#4f7082;font-size:12px;font-weight:900}.mark.cash{background:var(--soft);color:var(--green)}.donor{min-width:0;padding:11px 0}.donor strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.donor span,.donor p{color:var(--muted);font-size:11px}.donor p{margin:3px 0 0}.amount{text-align:right;font-size:14px;font-variant-numeric:tabular-nums}.empty{padding:44px 10px;text-align:center;color:var(--muted);font-size:13px}
    .more{width:100%;min-height:44px;margin-top:10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--green);font-weight:800}.stats{margin-top:18px;border:1px solid var(--line);border-radius:14px;background:#fff}.stats summary{padding:15px;font-size:13px;font-weight:800;cursor:pointer}.stats-body{padding:0 15px 10px}.stats-body div{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #edf0ed;font-size:12px}.stats-body span{color:var(--muted)}footer{padding:22px 0 0;text-align:center;color:#9aa09c;font-size:10px}
    .backdrop{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:#15251c80;padding:0}.sheet{width:min(100%,620px);max-height:92dvh;overflow:auto;padding:18px 18px calc(20px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:#fff}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.sheet-head h2{margin:0;font-size:19px}.close{width:36px;height:36px;border:0;border-radius:50%;background:#eef0ee;font-size:21px}.type{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;border-radius:12px;background:#edf0ed}.type button{min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:800}.type button.active{background:#fff;color:var(--green)}label{display:block;margin-top:15px;font-size:12px;font-weight:800}label em{color:var(--muted);font-style:normal;font-weight:400}label input{width:100%;height:48px;margin-top:7px;padding:0 12px;border:1px solid var(--line);border-radius:11px;outline:0}.preset{display:flex;gap:7px;margin-top:8px}.preset button{flex:1;min-height:36px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--green);font-size:12px;font-weight:800}.save{width:100%;min-height:50px;margin-top:20px;border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:900}.local-note{margin:10px 0 0;text-align:center;color:var(--muted);font-size:10px}
    .lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:var(--paper)}.lock[hidden],.app[hidden]{display:none}.lock-card{width:min(100%,360px);padding:28px 22px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 18px 50px #1d2b2314}.lock-card h1{margin:0 0 8px;font-size:24px}.lock-card p{margin:0;color:var(--muted);font-size:13px}.lock-card input{width:100%;height:50px;margin-top:20px;padding:0 14px;border:1px solid var(--line);border-radius:12px;outline:0;font-size:18px;letter-spacing:.2em}.lock-card input:focus{border-color:var(--green);box-shadow:0 0 0 3px #315c461a}.lock-card button{width:100%;height:48px;margin-top:10px;border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:900}.lock-error{min-height:17px!important;margin-top:10px!important;color:#b33d35!important;text-align:center}
    @media(min-width:700px){.app{padding-top:30px}.sheet{margin-bottom:24px;border-radius:22px}.backdrop{align-items:center;padding:20px}}
  </style>
</head>
<body>
  <section class="lock" id="lock">
    <form class="lock-card" id="lockForm">
      <h1>부조금 명부</h1><p>비밀번호를 입력해 주세요.</p>
      <input id="password" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" aria-label="비밀번호">
      <button type="submit">확인</button><p class="lock-error" id="lockError" role="alert"></p>
    </form>
  </section>
  <main class="app" id="app" hidden>
    <header class="top"><div><p>공개 명부</p><h1>부조금</h1></div><button class="add" id="openAdd">+ 추가</button></header>
    <section class="summary"><span id="sumLabel">전체 합계</span><strong id="sumAmount">0원</strong><p id="sumMeta"></p></section>
    <nav class="tabs" aria-label="부조금 분류"><button class="active" data-filter="전체">전체</button><button data-filter="계좌">계좌</button><button data-filter="현금">현금</button></nav>
    <label class="search"><b aria-hidden="true">⌕</b><input id="search" type="search" placeholder="이름 검색" aria-label="이름 검색"><button id="clear" aria-label="검색어 지우기">×</button></label>
    <div class="notice" id="notice" role="status"></div>
    <section class="list"><div class="list-head"><h2>명부</h2><span id="resultCount"></span></div><div class="sorter" id="sorter"><button class="active" data-sort="name">이름 순</button><button data-sort="seq">순번 순</button></div><div class="results" id="results"></div><button class="more" id="more">더 보기</button></section>
    <details class="stats"><summary>통계 보기</summary><div class="stats-body" id="stats"></div></details>
    <footer id="footer"></footer>
  </main>
  <div class="backdrop" id="backdrop">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="addTitle">
      <div class="sheet-head"><h2 id="addTitle">부조금 추가</h2><button class="close" id="closeAdd" aria-label="닫기">×</button></div>
      <form id="addForm">
        <div class="type"><button type="button" class="active" data-type="계좌">계좌</button><button type="button" data-type="현금">현금</button></div>
        <label>이름<input id="name" required maxlength="30" placeholder="이름 입력"></label>
        <label>금액<input id="amount" required min="1" max="10000000" inputmode="numeric" type="number" value="50000"></label>
        <div class="preset"><button type="button" data-amount="50000">5만원</button><button type="button" data-amount="100000">10만원</button><button type="button" data-amount="200000">20만원</button></div>
        <label>메모 <em>선택</em><input id="detail" maxlength="80" placeholder="소속이나 구분"></label>
        <button class="save" type="submit">저장</button>
        <p class="local-note">추가 내역은 현재 기기에만 저장됩니다.</p>
      </form>
    </section>
  </div>
  <script>
    (() => {
      const KEY="bujo-ledger-manual-v1", won=new Intl.NumberFormat("ko-KR"), collator=new Intl.Collator("ko-KR",{sensitivity:"base",numeric:true});
      const base=Array.isArray(window.BUJO_DATA)?window.BUJO_DATA:[]; let manual=[],filter="전체",query="",visible=30,addType="계좌",sortMode="name";
      try{manual=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(manual))manual=[]}catch{manual=[]}
      const $=id=>document.getElementById(id), fmt=n=>won.format(n)+"원", norm=s=>(s||"").replace(/\s/g,"").toLocaleLowerCase("ko-KR");
      function scoped(){return [...base.map((x,i)=>({...x,_order:i})),...manual.map((x,i)=>({...x,_order:base.length+i}))].filter(x=>filter==="전체"||x.type===filter).sort((a,b)=>filter==="계좌"&&sortMode==="seq"?a._order-b._order:collator.compare(norm(a.name),norm(b.name)))}
      function render(){
        const scope=scoped(), total=scope.reduce((s,x)=>s+x.amount,0);
        $("sumLabel").textContent=filter+" 합계";$("sumAmount").textContent=fmt(total);$("sumMeta").textContent=won.format(scope.length)+"건";$("sorter").style.display=filter==="계좌"?"grid":"none";
        const found=scope.filter(x=>!query||norm(x.name).includes(norm(query))||norm(x.detail).includes(norm(query)));
        $("resultCount").textContent=found.length+"건";$("footer").textContent="기본 명부 "+base.length+"건 · 이 기기에서 추가 "+manual.length+"건";
        $("results").innerHTML=found.length?found.slice(0,visible).map(x=>`<article class="row"><div class="mark ${x.type==="현금"?"cash":""}">${x.type==="현금"?"현":"계"}</div><div class="donor"><strong>${esc(x.name)}</strong><span>${x.type}${x.local?" · 수동 추가":""}</span>${x.detail?`<p>${esc(x.detail)}</p>`:""}</div><strong class="amount">${fmt(x.amount)}</strong></article>`).join(""):`<div class="empty">검색 결과가 없어요.</div>`;
        $("more").style.display=visible<found.length?"block":"none";
        const counts=new Map;scope.forEach(x=>counts.set(x.amount,(counts.get(x.amount)||0)+1));
        $("stats").innerHTML=[...counts].sort((a,b)=>b[1]-a[1]||a[0]-b[0]).map(([a,c])=>`<div><span>${a>=10000?won.format(a/10000)+"만원":fmt(a)}</span><strong>${c}건</strong></div>`).join("");
      }
      function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
      document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;visible=30;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));render()});
      document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{sortMode=b.dataset.sort;visible=30;document.querySelectorAll("[data-sort]").forEach(x=>x.classList.toggle("active",x===b));render()});
      $("search").oninput=e=>{query=e.target.value;visible=30;$("clear").style.display=query?"grid":"none";render()};
      $("clear").onclick=()=>{$("search").value="";query="";$("clear").style.display="none";render()};
      $("more").onclick=()=>{visible+=40;render()};
      $("openAdd").onclick=()=>{$("backdrop").style.display="flex";setTimeout(()=>$("name").focus(),50)};
      $("closeAdd").onclick=()=>$("backdrop").style.display="none";
      $("backdrop").onclick=e=>{if(e.target===$("backdrop"))$("backdrop").style.display="none"};
      document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{addType=b.dataset.type;document.querySelectorAll("[data-type]").forEach(x=>x.classList.toggle("active",x===b))});
      document.querySelectorAll("[data-amount]").forEach(b=>b.onclick=()=>$("amount").value=b.dataset.amount);
      $("addForm").onsubmit=e=>{e.preventDefault();const item={name:$("name").value.trim(),amount:Number($("amount").value),type:addType,detail:$("detail").value.trim(),local:true};if(!item.name||!Number.isInteger(item.amount)||item.amount<1)return;manual.push(item);localStorage.setItem(KEY,JSON.stringify(manual));filter=addType;visible=30;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x.dataset.filter===filter));$("backdrop").style.display="none";$("name").value="";$("detail").value="";$("notice").textContent=item.name+"님을 이 기기에 추가했어요.";$("notice").style.display="block";render()};
      const unlock=()=>{$("lock").hidden=true;$("app").hidden=false;sessionStorage.setItem("bujo-ledger-unlocked","1");render()};
      $("lockForm").onsubmit=e=>{e.preventDefault();if($("password").value==="1788")unlock();else{$("lockError").textContent="비밀번호가 맞지 않아요.";$("password").select()}};
      if(sessionStorage.getItem("bujo-ledger-unlocked")==="1")unlock();else setTimeout(()=>$("password").focus(),50);
    })();
  </script>
</body>
</html>
