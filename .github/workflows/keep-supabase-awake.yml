name: Keep Supabase active

on:
  schedule:
    # Supabase Free projects need regular user database activity.
    # Three lightweight reads per day are intentionally scheduled off the hour.
    - cron: "17 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-supabase-active
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one ledger row
        shell: bash
        run: |
          set -euo pipefail

          api_url="https://oqyyqrltxlsmwizwuoyc.supabase.co/rest/v1/manual_entries?select=id&limit=1"
          response_file="${RUNNER_TEMP}/supabase-response.txt"

          for attempt in 1 2 3; do
            status="$(curl --silent --show-error               --output "${response_file}"               --write-out "%{http_code}"               --max-time 20               --header "apikey: sb_publishable_aUWwSY8XtK762YQ_yuVAnQ_iNfTV5T6"               "${api_url}" || true)"

            if [[ "${status}" == "200" || "${status}" == "206" ]]; then
              echo "Supabase activity request succeeded."
              exit 0
            fi

            echo "Attempt ${attempt} returned HTTP ${status:-000}."
            sleep 10
          done

          echo "Supabase activity request failed."
          sed -n '1,20p' "${response_file}" || true
          exit 1
